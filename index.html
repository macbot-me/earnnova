<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EarnNova</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        .app {
            max-width: 500px;
            margin: auto;
            padding: 25px 18px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin-bottom: 5px;
        }

        .header p {
            color: #777;
        }

        .balance {
            background: #ffffff;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .balance span {
            display: block;
            color: #777;
            margin-bottom: 8px;
        }

        .balance strong {
            font-size: 35px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            margin-top: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .earn {
            background: #229ed9;
            color: white;
        }

        .withdraw {
            background: white;
            color: #222;
        }

        .info {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>💰 EarnNova</h1>
        <p id="welcome">Connecting...</p>
    </div>

    <div class="balance">
        <span>Your Balance</span>
        <strong id="balance">0</strong>
        <div>coins</div>
    </div>

    <button class="earn" onclick="watchAd()">
        🎬 Watch Ad & Earn
    </button>

    <button class="withdraw" onclick="withdraw()">
        💸 Withdraw
    </button>

    <div class="info">
        Complete activities to increase your balance.
    </div>

</div>

<script>

    // ==========================================
    // TELEGRAM
    // ==========================================

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe.user;


    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://wfhzrnskdwlojuswrwtj.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_aVDqzD_X3SixyNZrpGcqCA_lzyY7UlL";


    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    // ==========================================
    // TELEGRAM USER
    // ==========================================

    if (!user) {

        document.getElementById("welcome").textContent =
            "⚠️ Please open EarnNova from Telegram.";

    } else {

        document.getElementById("welcome").textContent =
            "👋 Welcome, " + user.first_name;

        registerUser();

    }


    // ==========================================
    // REGISTER USER
    // ==========================================

    async function registerUser() {

        const telegramId = String(user.id);

        const { data, error } = await supabaseClient
            .from("Users")
            .upsert(
                {
                    telegram_id: telegramId,
                    username: user.username || null,
                    first_name: user.first_name || null
                },
                {
                    onConflict: "telegram_id"
                }
            )
            .select()
            .single();


        if (error) {

            console.error("Registration error:", error);

            document.getElementById("welcome").textContent =
                "⚠️ Database connection error.";

            return;
        }


        console.log("User registered:", data);


        document.getElementById("balance").textContent =
            data.balance || 0;

    }


    // ==========================================
    // WATCH AD
    // ==========================================

    function watchAd() {

        alert("Ad system will be connected here.");

    }


    // ==========================================
    // WITHDRAW
    // ==========================================

    function withdraw() {

        alert("Withdrawal system coming soon.");

    }

</script>

</body>
</html>
